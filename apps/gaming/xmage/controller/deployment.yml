apiVersion: apps/v1
kind: Deployment
metadata:
  name: xmage-deployment
  labels:
    app: xmage-deployment
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: xmage-pod
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: xmage-pod
    spec:
      hostAliases:
        - ip: 0.0.0.0
          hostnames:
            - xmage.kdmorris.dev
      containers:
        - name: xmage 
          image: klastic/xmage-beta:1.4.59-dev_2026-05-26_22-35
          env: 
            - name: XMAGE_DOCKER_SERVER_ADDRESS
              value: "xmage.kdmorris.dev"
            - name: XMAGE_DOCKER_BIND_IP
              value : 0.0.0.0
            - name: XMAGE_DOCKER_SERVER_NAME
              value: "xmage-server"
            - name: XMAGE_DOCKER_MAX_SECONDS_IDLE
              value: "6000"
            - name: XMAGE_DOCKER_AUTHENTICATION_ACTIVATED
              value: "false" 
          ports: 
            - containerPort: 17171
              name: xmage-1
            - containerPort: 17179
              name: xmage-2
          volumeMounts:
            - mountPath: /xmage/mage-server/db
              name: config-volume # generated via configMapGenerator from kustomization file
      volumes:
        - name: config-volume
          persistentVolumeClaim: # stores /cache/ntfy in defined pv
            claimName: xmage-pvc
